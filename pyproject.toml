[project]
name = "pricesense"
version = "0.1.0"
description = "Estimating product prices from free-text descriptions with a QLoRA fine-tuned open-source LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "transformers==4.48.3",
    "datasets==3.2.0",
    "peft==0.14.0",
    "huggingface-hub>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Installed only on the training machine (Colab / any CUDA box)
gpu = [
    "bitsandbytes>=0.46.0",
    "accelerate==1.3.0",
    "trl==0.14.0",
    "wandb>=0.19.0",
]

[project.scripts]
pricesense = "pricesense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricesense"]